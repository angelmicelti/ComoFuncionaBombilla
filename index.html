<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cómo funciona una bombilla - Modelo Interactivo</title>
    
    <!-- Tailwind CSS (opcional, pero incluido según las mejores prácticas para escalar el proyecto) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Estilos personalizados para asegurar pantalla completa absoluta */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita cualquier barra de desplazamiento (scroll) */
            background-color: #111827; /* Un fondo oscuro (gray-900) para que el modelo resalte */
        }

        .fullscreen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* Suaviza un poco los bordes en pantallas muy grandes si se desea, aunque en pantalla completa no se notará */
            border-radius: 0; 
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- Iframe adaptado para ser 100% responsivo y ocupar toda la pantalla -->
    <iframe 
        src="https://www.things-workshop.com/embed/light-bulb/" 
        title="How does a light bulb work?: interactive model from Things Workshop" 
        class="fullscreen-iframe"
        loading="lazy" 
        allow="autoplay; fullscreen; xr-spatial-tracking"
        allowfullscreen>
    </iframe>

</body>
</html>
